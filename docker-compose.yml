services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: familytree
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familytree -d familytree"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single instance only. Startup seeding (DatabaseSeeder) has no advisory lock, so two
  # replicas booting at once would race to insert the same seeded tenant/admin and the
  # loser would fail loudly on a unique constraint. Do not add `deploy.replicas` or any
  # other scaling config here until seeding takes a lock (tracked for a later phase).
  api:
    build:
      context: .
      dockerfile: src/FamilyTree.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=familytree;Username=familytree;Password=${POSTGRES_PASSWORD:-devpassword}"
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:5000}
      Jwt__Audience: ${JWT_AUDIENCE:-familytree-api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      Seed__TenantName: ${SEED_TENANT_NAME:-Al-Saqqa Family}
      Seed__TenantSlug: ${SEED_TENANT_SLUG:-al-saqqa}
      Seed__FamilyTreeName: ${SEED_FAMILY_TREE_NAME:-عائلة السقا}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL must be set}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The published port is overridable because 8080 is a popular default — an Oracle TNS
  # listener, a Tomcat, a second project's dev server — and a machine that already has one
  # cannot start this stack at all. Set FRONTEND_PORT in .env to move it; the default is
  # unchanged, so nothing has to be configured on a machine where 8080 is free.
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:

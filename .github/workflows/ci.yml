name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      - name: Install poppler for PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # Integration tests start their own PostgreSQL via Testcontainers, which needs
      # the Docker daemon the ubuntu-latest runner already provides.
      - run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # `tsconfig.json` has "files": [] and delegates to project references, so bare
      # `tsc --noEmit` type-checks an empty program and always exits 0. `tsc -b` builds
      # the referenced projects (tsconfig.app.json, tsconfig.node.json) and actually
      # reports type errors.
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/FamilyTree.Api/Dockerfile -t familytree-api .
      - run: docker build -f frontend/Dockerfile -t familytree-frontend ./frontend

  # Applies schema migrations, then — and only then — triggers the Render deploy.
  #
  # The api service sets `autoDeploy: false` in render.yaml precisely so this job owns the
  # ordering. Migrations run first; if `efbundle` fails, the deploy hook is never called and
  # the currently-running instance keeps serving the old, matching schema.
  #
  # Push-to-main only: pull requests must never touch the production database.
  migrate-and-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]

    # Placeholders, needed by BOTH the build and the apply step — verified by running the bundle
    # against a throwaway Postgres. EF boots the API's host to resolve the DbContext, not just
    # when generating the bundle but every time the bundle runs, and Program.cs throws
    # "Jwt configuration section is missing" when that section is absent. The signing key must
    # clear JwtTokenService's 32-byte minimum. None of these reach the deployed service: Render
    # supplies the real Jwt values, and the real connection string arrives via --connection.
    env:
      Jwt__Issuer: https://migration-placeholder
      Jwt__Audience: familytree-api
      Jwt__SigningKey: migration-placeholder-not-used-at-runtime-32b
      ConnectionStrings__DefaultConnection: Host=placeholder;Database=familytree;Username=x;Password=y

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool install --global dotnet-ef

      # Required before the bundle build. `dotnet ef migrations bundle` does not restore on its
      # own and fails with NETSDK1004 ("Assets file project.assets.json not found") on a fresh
      # runner. This job checks out clean, so nothing else has restored for it.
      - run: dotnet restore

      # A bundle rather than `dotnet ef database update`: it is a self-contained executable
      # carrying only the migrations, so the deploy step needs no SDK, no project restore, and
      # cannot accidentally pick up model changes that were never committed as a migration.
      - name: Build migration bundle
        run: |
          dotnet ef migrations bundle \
            --self-contained -r linux-x64 \
            --project src/FamilyTree.Infrastructure \
            --startup-project src/FamilyTree.Api \
            --configuration Release \
            -o efbundle

      # NEON_CONNECTION_STRING must be in Npgsql key/value form, not Neon's postgresql:// URI.
      # Quoted because the string contains semicolons. --connection overrides the placeholder
      # ConnectionStrings__DefaultConnection set at job level.
      - name: Apply migrations
        run: ./efbundle --connection "$NEON_CONNECTION_STRING"
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}

      # --fail turns a non-2xx into a non-zero exit; without it curl reports success on a 404
      # deploy hook and a failed deploy would look green.
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
